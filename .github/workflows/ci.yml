name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: engine-gateway
      - uses: actions/checkout@v6
        with:
          repository: Pocket-Hoedown/engine-gateway-protocol
          path: protocol
          token: ${{ secrets.PROTOCOL_REPOSITORY_TOKEN }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.3
      - run: deno task protocol:drift
        working-directory: engine-gateway
      - run: deno fmt --check
        working-directory: engine-gateway
      - run: deno lint
        working-directory: engine-gateway
      - run: deno check src/server.ts
        working-directory: engine-gateway
      - run: deno test -A
        working-directory: engine-gateway
